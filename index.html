<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTuber Cam</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e24; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 8px;
        width: 210px; padding: 10px; background: rgba(0,0,0,.6); border-radius: 10px; color: #fff; font-size: 13px; }
  #ui.hidden { display: none; }
  button, input[type=color] { font: inherit; padding: 6px 8px; border-radius: 6px; border: 0; cursor: pointer; }
  button { background: #6c5ce7; color: #fff; }
  button.alt { background: #444; }
  label { display: flex; align-items: center; gap: 6px; }
  #status { opacity: .85; line-height: 1.3; }
  #cam { width: 100%; border-radius: 6px; transform: scaleX(-1); display: none; background: #000; }
  #meter { position: relative; height: 6px; background: #333; border-radius: 3px; margin: 6px 0 4px; }
  #meterFill { height: 100%; width: 0; background: #6c5ce7; border-radius: 3px; }
  #meterMark { position: absolute; top: -2px; width: 2px; height: 10px; background: #fff; }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.min.js",
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>
</head>
<body>
<div id="ui">
  <button id="startBtn">Start camera</button>
  <video id="cam" playsinline muted></video>
  <label class="alt" style="cursor:pointer">
    <span>Load VRM:</span>
    <input id="file" type="file" accept=".vrm" style="width:100%">
  </label>
  <div class="row">
    <button id="bgBtn" class="alt">Background</button>
    <input id="bgColor" type="color" value="#1e1e24">
  </div>
  <label><input id="swap" type="checkbox"> Swap winks (L/R)</label>
  <label><input id="body" type="checkbox" checked> Track upper body</label>
  <label><input id="smooth" type="checkbox" checked> Smooth motion</label>
  <label><input id="mic" type="checkbox"> Mic lip-sync (beard mode)</label>
  <div id="micBox" style="display:none">
    <div id="meter"><div id="meterFill"></div><div id="meterMark"></div></div>
    <input id="micThr" type="range" min="0.005" max="0.15" step="0.005" value="0.03" style="width:100%" title="Sound threshold">
    <small>Talk: the bar should pass the white mark. Slide left for more sensitive.</small>
  </div>
  <input id="smoothAmt" type="range" min="0" max="1" step="0.05" value="0.7" title="Smoothing strength (higher = smoother but laggier)">
  <button id="hideBtn" class="alt">Hide panel</button>
  <div id="status">Loading model…</div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { FaceLandmarker, PoseLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

const $ = (id) => document.getElementById(id);
const status = (t) => ($('status').textContent = t);

/* ---------- Scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
const light = new THREE.DirectionalLight(0xffffff, Math.PI);
light.position.set(1, 1.5, 2);
scene.add(light, new THREE.AmbientLight(0xffffff, 0.6));

let camDist = 1.1;
const camTarget = new THREE.Vector3(0, 1.3, 0);
function placeCamera() {
  camera.position.set(camTarget.x, camTarget.y, camDist);
  camera.lookAt(camTarget);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('wheel', (e) => { camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.001, 0.4, 4); placeCamera(); });
resize(); placeCamera();

/* ---------- VRM loading ---------- */
const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
let vrm = null;

function loadVRM(url) {
  return new Promise((resolve, reject) => {
    loader.load(url, (gltf) => {
      const v = gltf.userData.vrm;
      if (!v) return reject(new Error('Not a VRM file'));
      VRMUtils.rotateVRM0(v); // faces VRM 0.x models the right way
      if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
      vrm = v;
      vrm.scene.traverse((o) => (o.frustumCulled = false));
      scene.add(vrm.scene);
      lowerArms(); // out of T-pose
      // Frame the head and shoulders
      vrm.scene.updateMatrixWorld(true);
      const head = vrm.humanoid.getNormalizedBoneNode('head');
      if (head) {
        const p = new THREE.Vector3(); head.getWorldPosition(p);
        camTarget.set(0, p.y - 0.08, 0);
        camDist = Math.max(0.5, p.y * 0.8);
        placeCamera();
      }
      resolve();
    }, undefined, reject);
  });
}

loadVRM('./model.vrm')
  .then(() => status('Model loaded. Press Start camera.'))
  .catch(() => status('No model.vrm found. Use Load VRM to pick a file.'));

$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  try { await loadVRM(url); status('Loaded ' + f.name); }
  catch (err) { status('Could not load that file: ' + err.message); }
  URL.revokeObjectURL(url);
});

/* ---------- Face tracking ---------- */
const video = $('cam');
let landmarker = null;
let lastVideoTime = -1;
const smooth = {};
// Smoothing: base is the per-frame blend factor; the toggle and slider scale it (1 = raw, no smoothing)
const sm = (base) => ($('smooth').checked ? Math.min(1, base * (1.5 - 1.3 * $('smoothAmt').value)) : 1);
const ease = (key, target, a = 0.5) => (smooth[key] = (smooth[key] ?? 0) + (target - (smooth[key] ?? 0)) * sm(a));
const clamp01 = (v) => Math.min(1, Math.max(0, v));

$('startBtn').addEventListener('click', async () => {
  $('startBtn').disabled = true;
  try {
    status('Starting camera…');
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480 }, audio: false
    });
    await video.play();
    video.style.display = 'block';

    status('Loading face tracker…');
    const fileset = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    landmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numFaces: 1,
      outputFaceBlendshapes: true,
      outputFacialTransformationMatrixes: true
    });
    poseError = false;
    if ($('body').checked) await ensurePose();
    if (!poseError) status('Tracking. Move your face and arms!');
    $('startBtn').textContent = 'Camera on';
  } catch (err) {
    status('Camera or tracker failed: ' + err.message);
    $('startBtn').disabled = false;
  }
});

const m4 = new THREE.Matrix4(), pos = new THREE.Vector3(), quat = new THREE.Quaternion(), scl = new THREE.Vector3();
const euler = new THREE.Euler(0, 0, 0, 'YXZ');
const IDENT = new THREE.Quaternion();

function applyTracking(res) {
  if (!vrm) return;

  // Expressions
  if (res.faceBlendshapes?.length) {
    const b = {};
    for (const c of res.faceBlendshapes[0].categories) b[c.categoryName] = c.score;
    const swap = $('swap').checked;
    const [l, r] = swap ? [b.eyeBlinkRight, b.eyeBlinkLeft] : [b.eyeBlinkLeft, b.eyeBlinkRight];
    const em = vrm.expressionManager;
    em.setValue('blinkLeft',  ease('bl', clamp01(l * 1.3), 0.6));
    em.setValue('blinkRight', ease('br', clamp01(r * 1.3), 0.6));
    if (!micMode()) { // in mic mode the mouth shapes come from sound instead
      em.setValue('aa', ease('aa', clamp01(b.jawOpen * 1.5)));
      em.setValue('ou', ease('ou', clamp01(b.mouthPucker * 1.2)));
      em.setValue('oh', ease('oh', clamp01(b.mouthFunnel * 1.2)));
    }
    em.setValue('happy', ease('hp', clamp01(((b.mouthSmileLeft + b.mouthSmileRight) / 2) * 1.5)));
  }

  // Head rotation (all three axes flipped to match the mirrored view)
  if (res.facialTransformationMatrixes?.length) {
    m4.fromArray(res.facialTransformationMatrixes[0].data);
    m4.decompose(pos, quat, scl);
    euler.setFromQuaternion(quat, 'YXZ');
    const target = new THREE.Quaternion().setFromEuler(new THREE.Euler(-euler.x, -euler.y, -euler.z, 'YXZ'));
    const head = vrm.humanoid.getNormalizedBoneNode('head');
    const neck = vrm.humanoid.getNormalizedBoneNode('neck');
    // Split the motion between neck and head for a more natural look
    if (head) head.quaternion.slerp(IDENT.clone().slerp(target, neck ? 0.6 : 1), sm(0.4));
    if (neck) neck.quaternion.slerp(IDENT.clone().slerp(target, 0.4), sm(0.4));
  }
}

/* ---------- Upper body (MediaPipe Pose) ---------- */
let poseLandmarker = null, poseLoading = false, poseError = false, lastPoseTime = -1;

async function ensurePose() {
  if (poseLandmarker || poseLoading) return;
  poseLoading = true;
  try {
    status('Loading body tracker…');
    const fileset = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    poseLandmarker = await PoseLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numPoses: 1
    });
    status('Tracking face and body.');
  } catch (err) {
    poseError = true;
    status('Body tracker failed: ' + err.message);
    $('body').checked = false;
  }
  poseLoading = false;
}

// Static pose: arms down, torso straight
function lowerArms() {
  if (!vrm) return;
  const h = vrm.humanoid;
  const l = h.getNormalizedBoneNode('leftUpperArm'), r = h.getNormalizedBoneNode('rightUpperArm');
  if (l) l.rotation.z = -1.2;
  if (r) r.rotation.z = 1.2;
  for (const n of ['leftLowerArm', 'rightLowerArm', 'spine', 'chest']) h.getNormalizedBoneNode(n)?.quaternion.identity();
}
$('body').addEventListener('change', () => {
  if ($('body').checked) { if (video.srcObject) ensurePose(); }
  else lowerArms();
});

const tmpQ = new THREE.Quaternion(), parentQ = new THREE.Quaternion(), sceneQ = new THREE.Quaternion();

// Rotate a bone so it points along dirWorld (a direction in world space)
function aimBone(name, childName, dirWorld, a = 0.35) {
  const bone = vrm.humanoid.getNormalizedBoneNode(name);
  const child = vrm.humanoid.getNormalizedBoneNode(childName);
  if (!bone || !child || !bone.parent) return;
  bone.parent.getWorldQuaternion(parentQ);
  const local = dirWorld.clone().normalize().applyQuaternion(parentQ.clone().invert());
  tmpQ.setFromUnitVectors(child.position.clone().normalize(), local); // rest direction -> target
  bone.quaternion.slerp(tmpQ, sm(a));
  bone.updateWorldMatrix(true, true);
}

// MediaPipe world coords (x right, y down, z away) -> mirrored scene coords (x right, y up, z toward viewer)
const toScene = (p) => new THREE.Vector3(-p.x, -p.y, -p.z);
const seen = (p) => (p?.visibility ?? 0) > 0.5;

// [model side, shoulder, elbow, wrist, outward x]. The subject's left is the model's right (mirror).
const ARMS = [['left', 12, 14, 16, 1], ['right', 11, 13, 15, -1]];

function applyPose(res) {
  const w = res.worldLandmarks?.[0], v = res.landmarks?.[0];
  if (!w || !v || !vrm) return;
  const h = vrm.humanoid;

  // Torso: twist and side lean from the shoulder line
  if (seen(v[11]) && seen(v[12])) {
    const sh = toScene(w[12]).sub(toScene(w[11])); // model-left shoulder minus model-right shoulder
    const yaw = THREE.MathUtils.clamp(Math.atan2(-sh.z, sh.x), -0.8, 0.8);
    const roll = THREE.MathUtils.clamp(Math.atan2(sh.y, sh.x), -0.5, 0.5);
    const R = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, roll, 'YXZ'));
    sceneQ.copy(vrm.scene.quaternion);
    const local = sceneQ.clone().invert().multiply(R).multiply(sceneQ); // world rotation -> rig-local
    const chest = h.getNormalizedBoneNode('chest'), spine = h.getNormalizedBoneNode('spine');
    if (spine) spine.quaternion.slerp(IDENT.clone().slerp(local, chest ? 0.5 : 1), sm(0.3));
    if (chest) chest.quaternion.slerp(IDENT.clone().slerp(local, 0.5), sm(0.3));
    vrm.scene.updateMatrixWorld(true);
  }

  // Arms: aim each bone from joint to joint, or relax downward if the joint is out of frame
  for (const [side, s, e, wr, out] of ARMS) {
    const relaxed = new THREE.Vector3(out * 0.25, -1, 0);
    const haveElbow = seen(v[s]) && seen(v[e]);
    const upper = haveElbow ? toScene(w[e]).sub(toScene(w[s])) : relaxed;
    const lower = haveElbow && seen(v[wr]) ? toScene(w[wr]).sub(toScene(w[e])) : upper;
    aimBone(side + 'UpperArm', side + 'LowerArm', upper);
    aimBone(side + 'LowerArm', side + 'Hand', lower);
  }
}

/* ---------- Mic lip-sync ---------- */
// Sound above the threshold triggers random vowel shapes; the smile still comes from face tracking.
let audioCtx = null, micStream = null, analyser = null, micBuf = null;
let micLevel = 0, talkUntil = 0, vowel = 'aa', vowelUntil = 0, openAmt = 1;
const VOWELS = ['aa', 'ih', 'ou', 'ee', 'oh'];
const mouth = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
const METER_MAX = 0.15;
const micMode = () => $('mic').checked && !!analyser;

async function startMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true }, video: false
    });
    audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    micBuf = new Float32Array(analyser.fftSize);
    return true;
  } catch (err) {
    status('Microphone failed: ' + err.message);
    return false;
  }
}
function stopMic() {
  micStream?.getTracks().forEach((t) => t.stop());
  audioCtx?.close();
  micStream = audioCtx = analyser = null;
  micLevel = 0;
  for (const n of VOWELS) { mouth[n] = 0; vrm?.expressionManager.setValue(n, 0); }
}
$('mic').addEventListener('change', async () => {
  if ($('mic').checked) {
    if (await startMic()) { $('micBox').style.display = 'block'; status('Mic lip-sync on.'); }
    else $('mic').checked = false;
  } else {
    stopMic();
    $('micBox').style.display = 'none';
  }
});

function updateMouth(dt) {
  const thr = parseFloat($('micThr').value);
  const now = performance.now();

  analyser.getFloatTimeDomainData(micBuf);
  let sum = 0;
  for (let i = 0; i < micBuf.length; i++) sum += micBuf[i] * micBuf[i];
  micLevel = Math.sqrt(sum / micBuf.length);
  if (micLevel > thr) talkUntil = now + 150; // short hold so gaps between words don't flicker
  const talking = now < talkUntil;

  if (talking && now > vowelUntil) { // pick a new random shape every 80-170 ms
    vowel = VOWELS[Math.floor(Math.random() * VOWELS.length)];
    vowelUntil = now + 80 + Math.random() * 90;
    openAmt = 0.55 + Math.random() * 0.45;
  }
  const loud = Math.min(1, micLevel / (thr * 4)); // louder speech opens wider
  const k = 1 - Math.exp(-dt * 20);
  for (const n of VOWELS) {
    const target = talking && n === vowel ? clamp01(openAmt * (0.5 + 0.5 * loud)) : 0;
    mouth[n] += (target - mouth[n]) * k;
    vrm.expressionManager.setValue(n, mouth[n]);
  }

  $('meterFill').style.width = Math.min(100, (micLevel / METER_MAX) * 100) + '%';
  $('meterMark').style.left = (thr / METER_MAX) * 100 + '%';
}

/* ---------- Main loop ---------- */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    applyTracking(landmarker.detectForVideo(video, performance.now()));
  }
  if (poseLandmarker && $('body').checked && video.readyState >= 2 && video.currentTime !== lastPoseTime) {
    lastPoseTime = video.currentTime;
    applyPose(poseLandmarker.detectForVideo(video, performance.now()));
  }
  if (vrm && micMode()) updateMouth(dt);
  if (vrm) vrm.update(dt);
  renderer.render(scene, camera);
});

/* ---------- Background toggle and UI ---------- */
const bgPresets = ['#1e1e24', '#00b140', '#ffffff', '#ff00ff', '#000000'];
let bgIndex = 0;
function setBg(color) {
  document.body.style.background = color;
  $('bgColor').value = color;
}
$('bgBtn').addEventListener('click', () => { bgIndex = (bgIndex + 1) % bgPresets.length; setBg(bgPresets[bgIndex]); });
$('bgColor').addEventListener('input', (e) => setBg(e.target.value));

const togglePanel = () => $('ui').classList.toggle('hidden');
$('hideBtn').addEventListener('click', togglePanel);
addEventListener('keydown', (e) => { if (e.key === 'h' || e.key === 'H') togglePanel(); });
addEventListener('dblclick', (e) => { if ($('ui').classList.contains('hidden')) togglePanel(); });
</script>
</body>
</html>
